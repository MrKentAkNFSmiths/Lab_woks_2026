[build-system]
requires = ['setuptools>=64.0']
build-backend = 'setuptools.build_meta'

[project]
name = "toolkit"
version = "0.10.1"
requires-python = '>=3.10'

[project.scripts]
toolkit = "toolkit.__main__:main"

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8"
]